services:
  floci:
    image: floci/floci:2.1.0
    container_name: laravel-cloud-floci
    restart: unless-stopped
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:9200-9299:9200-9299"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FLOCI_SERVICES_DOCKER_NETWORK: laravel_cloud_floci
      FLOCI_HOSTNAME: localhost.floci.io
      FLOCI_BASE_URL: http://localhost.floci.io:4566
      FLOCI_SERVICES_LAMBDA_HOT_RELOAD_ENABLED: "true"
    networks:
      laravel_cloud_floci:
        aliases:
          - localhost.floci.io

networks:
  laravel_cloud_floci:
    name: laravel_cloud_floci
